<html lang="en"><head>

<link rel="stylesheet" href="css/style.css">
<script defer src="js/main.js"></script>
<title>Register | UIU BookHUB</title></head><body>

<header class="site-navbar">
  <div class="container nav-inner">
    <a class="brand" href="index.html"><img src="assets/logo.png" alt="UIU BookHUB"></a>
    <button class="menu-toggle" aria-label="Open menu"><i class="fa-solid fa-bars"></i></button>
    <nav class="nav-links">
      <a class="" href="index.html">Home</a>
      <a class="" href="marketplace.html">Marketplace</a>
      <a href="marketplace.html">Categories</a>
      <a href="index.html#how-it-works">How It Works</a>
    </nav>
    <div class="nav-actions">
      <a href="login.html" class="icon-link" aria-label="Wishlist"><i class="fa-regular fa-heart"></i><span class="count">3</span></a>
      <a href="login.html" class="btn btn-outline login-link">Login</a>
      <a href="register.html" class="btn btn-primary">Register</a>
    </div>
  </div>
</header>
<section class="auth-page"><div class="container"><div class="auth-card">
  <img class="auth-logo" src="assets/logo.png" alt="UIU BookHUB">
  <h1>Create Account</h1><p>One UIU student account can both buy and sell.</p>
  <form class="demo-form" data-message="Demo account created. You can now open the dashboard.">
    <div class="form-row"><div class="form-group"><label>Full Name</label><input class="form-control" placeholder="Your name" required></div><div class="form-group"><label>Student ID</label><input class="form-control" placeholder="01123..." required></div></div>
    <div class="form-group"><label>UIU Email</label><input class="form-control" type="email" placeholder="student@uiu.ac.bd" required></div>
    <div class="form-row"><div class="form-group"><label>Department</label><select class="form-control"><option>CSE</option><option>EEE</option><option>BBA</option><option>Economics</option><option>Other</option></select></div><div class="form-group"><label>Phone</label><input class="form-control" placeholder="01XXXXXXXXX"></div></div>
    <div class="form-row"><div class="form-group"><label>Password</label><input class="form-control" type="password" required></div><div class="form-group"><label>Confirm Password</label><input class="form-control" type="password" required></div></div>
    <div class="form-note"><i class="fa-solid fa-circle-info"></i> Your account can be used for both buying and selling. There is no separate buyer/seller account.</div>
    <button class="btn btn-primary" style="width:100%;" type="submit">Create Account</button>
  </form>
  <div class="auth-footer">Already have an account? <a href="login.html">Login</a></div>
</div></div></section><div class="toast"></div></body></html>
